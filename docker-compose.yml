services:
  api:
    build: ./apps/api
    volumes:
      - ./data:/data
    environment:
      IFBUY_DB: /data/ifbuy.db
      CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped
